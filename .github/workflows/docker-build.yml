name: Build and Push Docker Images

on:
  push:
    branches: [container]
    paths:
      - docker/**
      - .github/workflows/docker-build.yml

jobs:
  build-align:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.align
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bixbeta/wgs-align:latest
            ghcr.io/bixbeta/wgs-align:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/bixbeta/wgs-align:cache
          cache-to: type=registry,ref=ghcr.io/bixbeta/wgs-align:cache,mode=max

  build-qualimap:
